[package]
name = "linux-imx"
version = "6.12.49"
summary = "NXP i.MX Linux kernel (lf-6.12.y) for the i.MX6ULL alpha board, with the imx_aes board patch (zImage + dtbs)."
license = "GPL-2.0-only"
scope = "target"
provides = ["virtual:kernel"]
depends = []

[source]
kind = "archive"
# Generated by packages/company/make-sources.sh from imx-forge's linux-imx submodule
# (origin/lf-6.12.y — the base linux-imx-latest.patch applies against). Regenerate
# + repin if the submodule moves.
url = "file:///home/charliechen/lightroot/packages/company/archives/linux-imx-df24f9428e38.tar.gz"
sha256 = "a6f377875e7e30af9d1d5cc6a93f1d3695e15e9f5d7dfc28bfd75b92457b8cf0"
patches = ["patches/linux-imx-latest.patch"]

[build]
backend = "script"

# linux-imx-latest.patch adds arch/arm/configs/imx_aes_defconfig and the
# imx6ull-aes device tree (dts/dtsi + Makefile rule). defconfig selects the board;
# `zImage dtbs` emits the compressed arm32 kernel + the board dtb. Modules are not
# built (the defconfig is monolithic for bring-up) — add a modules step later if
# needed.
[build.configure]
run = ["make ARCH=$LIGHTROOT_ARCH CROSS_COMPILE=$LIGHTROOT_CROSS_COMPILE imx_aes_defconfig"]

[build.build]
run = ["make ARCH=$LIGHTROOT_ARCH CROSS_COMPILE=$LIGHTROOT_CROSS_COMPILE -j$LIGHTROOT_JOBS zImage dtbs"]

# Boot artifacts (not part of the rootfs) -> $LIGHTROOT_OUT for the imx-sdcard
# assembler to pick up.
[build.install_staging]
run = [
    "mkdir -p $LIGHTROOT_OUT",
    "cp arch/arm/boot/zImage $LIGHTROOT_OUT/zImage",
    "cp arch/arm/boot/dts/nxp/imx/imx6ull-aes.dtb $LIGHTROOT_OUT/imx6ull-aes.dtb",
]
