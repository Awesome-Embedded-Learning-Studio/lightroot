[package]
name = "uboot-imx"
version = "2025.4"
summary = "NXP U-Boot bootloader for the i.MX6ULL alpha-EVK emmc board (imx-forge lf_v2025.04 + charlies_board patch)."
license = "GPL-2.0+"
scope = "target"
provides = ["virtual:bootloader"]
depends = []

[source]
kind = "archive"
# Generated by packages/company/make-sources.sh from imx-forge's uboot-imx submodule
# (origin/lf_v2025.04 — the base the patch applies against). Regenerate + repin if
# the submodule moves.
url = "file:///home/charliechen/lightroot/packages/company/archives/uboot-imx-99518e6b6f2.tar.gz"
sha256 = "da3c701935405298f3a6ed30b6405cb91ba916140e055676bb7e6bc0fca9aec0"
patches = ["patches/charlies_board.patch"]

[build]
backend = "script"

# charlies_board.patch adds the mx6ull_aes_emmc board (defconfig + dts). defconfig
# selects it; a plain `make` then emits u-boot-dtb.imx (NXP IVT/DCD image) through
# U-Boot's own built-in image tools.
[build.configure]
run = ["make ARCH=$LIGHTROOT_ARCH CROSS_COMPILE=$LIGHTROOT_CROSS_COMPILE mx6ull_aes_emmc_defconfig"]

[build.build]
run = ["make ARCH=$LIGHTROOT_ARCH CROSS_COMPILE=$LIGHTROOT_CROSS_COMPILE -j$LIGHTROOT_JOBS"]

# U-Boot is a boot artifact, not part of the rootfs — export it via $LIGHTROOT_OUT
# so the imx-sdcard assembler can pick it up. No install_target.
[build.install_staging]
run = ["mkdir -p $LIGHTROOT_OUT", "cp u-boot-dtb.imx $LIGHTROOT_OUT/"]
