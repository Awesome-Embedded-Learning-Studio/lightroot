[package]
name = "zlib"
version = "1.3.1"
summary = "Lossless data compression library (cmake backend, static)."
license = "Zlib"
scope = "target"
depends = []

[source]
kind = "archive"
url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"

[build]
backend = "cmake"

# Static library (typical for embedding into a static rootfs); demonstrates the
# per-package env override flowing into the cmake configure step.
[build.env]
BUILD_SHARED_LIBS = "OFF"
