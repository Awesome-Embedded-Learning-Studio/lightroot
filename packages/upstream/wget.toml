[package]
name = "wget"
version = "1.21.4"
summary = "Network file retriever."
license = "GPL-3.0-or-later"
scope = "target"
provides = []
depends = ["zlib", "virtual:ssl"]

[source]
kind = "archive"
url = "https://ftp.gnu.org/gnu/wget/wget-1.21.4.tar.gz"
sha256 = "81542f5cefb8faacc39bbbc6c82ded80e3e4a88505ae72ea51df27525bcde04c"

# Cross-built via autotools. zlib + openssl are consumed from staging. Key trick:
# PKG_CONFIG_LIBDIR is pinned to staging's pkgconfig so configure finds ONLY the
# cross-built zlib/openssl (.pc) and never mismatched HOST pcre2/libpsl/libidn2.
# Literal TOML strings (single-quoted) so the shell's double quotes let
# $LIGHTROOT_STAGING expand at configure time (not be recorded literally).
[build]
backend = "autotools"

[build.configure]
run = ['./configure --host=$LIGHTROOT_TARGET --prefix=/usr --with-ssl=openssl --with-openssl=$LIGHTROOT_STAGING/usr PKG_CONFIG_PATH=$LIGHTROOT_STAGING/usr/lib/pkgconfig PKG_CONFIG_LIBDIR=$LIGHTROOT_STAGING/usr/lib/pkgconfig CPPFLAGS="-I$LIGHTROOT_STAGING/usr/include -DOPENSSL_API_COMPAT=0x10100000L" LDFLAGS="-L$LIGHTROOT_STAGING/usr/lib"']

[build.build]
run = ['make -j$LIGHTROOT_JOBS']

[build.install_target]
run = ['make DESTDIR=$LIGHTROOT_DESTDIR install']
